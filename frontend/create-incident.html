<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Incident</title>
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <header class="app-header">
        <div class="container header-inner">
            <a href="/dashboard.html" class="btn btn-secondary btn-sm">← Back</a>
            <h1 class="app-title" style="font-size:1.1rem; margin:0;">Create Incident</h1>
            <div class="header-right">
                <span id="user-info" class="user-badge">Loading...</span>
                <button id="logout-btn" class="btn btn-secondary btn-sm">Logout</button>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top:1.5rem;">
        <div class="detail-section">
            <form id="create-form">
                <div class="form-group">
                    <label for="incident-title">Title *</label>
                    <input type="text" id="incident-title" required />
                </div>
                <div class="form-group">
                    <label for="incident-description">Description *</label>
                    <textarea id="incident-description" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label for="reported-priority-text">Reported Priority (optional)</label>
                    <input type="text" id="reported-priority-text" placeholder="e.g., 'This is urgent!'" />
                </div>
                <div class="form-group">
                    <label for="application-select">Application *</label>
                    <select id="application-select" required>
                        <option value="">Loading applications...</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Create Incident</button>
                <div id="create-error" class="error-message hidden"></div>
            </form>
        </div>
    </main>

    <script type="module" src="/static/js/create-incident.js"></script>
</body>
</html>
